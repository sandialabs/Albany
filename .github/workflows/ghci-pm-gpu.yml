name: pm-gpu-build

# Build-only CI mimicking the Perlmutter GPU (pm-gpu) nightly build
# (see doc/dashboards/perlmutter.nersc.gov/cuda). Github runners have no GPUs,
# so Albany is built and installed but no tests are run.

on:
  # Runs on PRs against master
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, ready_for_review, reopened]

  # Manual run for debugging
  workflow_dispatch:

  # Also run nightly
  schedule:
    - cron: '0 7 * * *'  # Runs at 7 AM UTC, which is midnight MT during Standard Time

permissions:
  contents: read  # Required to read repository contents
  packages: read  # Required to read packages from the GitHub Container Registry

concurrency:
  # Two runs are in the same group if they are testing the same git ref
  #  - if trigger=pull_request, the ref is refs/pull/<PR_NUMBER>/merge
  #  - for other triggers, the ref is the branch tested
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slfad:
    runs-on:  [ubuntu-latest]
    # Compiling Albany with nvcc on a github runner is slow
    timeout-minutes: 360
    container:
      image: ghcr.io/sandialabs/albany:pm-gpu
      credentials:
        username: ${{ github.actor }}  # Use the GitHub actor as the username
        password: ${{ secrets.GITHUB_TOKEN }}  # Use the GITHUB_TOKEN for authentication
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          path: albany/source
      - name: Setup GIT
        run: |
          # This prevents ssh errors when Albany tries to pull Omega_h from github
          git config --global url."https://github.com/".insteadOf git@github.com:
      - name: Configure Albany
        # Mimics doc/dashboards/perlmutter.nersc.gov/cuda/do-cmake-pm_gpu-albany-slfad
        run: |
          export ALBANY_INSTALL=${GITHUB_WORKSPACE}/albany/install
          mkdir -p ${GITHUB_WORKSPACE}/albany/build && cd ${GITHUB_WORKSPACE}/albany/build
          cmake \
            -D CMAKE_BUILD_TYPE:STRING=RELEASE                                \
            -D ALBANY_TRILINOS_DIR:FILEPATH=${TRILINOS_ROOT}                  \
            -D CMAKE_INSTALL_PREFIX:PATH=${ALBANY_INSTALL}                    \
            -D CMAKE_CXX_COMPILER=${NVCC_WRAPPER}                             \
            -D CMAKE_C_COMPILER=mpicc                                         \
            -D CMAKE_CXX_FLAGS:STRING=""                                      \
            -D CMAKE_VERBOSE_MAKEFILE:BOOL=OFF                                \
            -D ENABLE_DEMO_PDES:BOOL=OFF                                      \
            -D ENABLE_LANDICE:BOOL=ON                                         \
            -D ENABLE_MESH_DEPENDS_ON_PARAMETERS:BOOL=OFF                     \
            -D BUILD_SHARED_LIBS:BOOL=ON                                      \
            -D Albany_BUILD_STATIC_EXE:BOOL=OFF                               \
            -D CMAKE_INSTALL_RPATH:PATH=${ALBANY_INSTALL}/lib64               \
            -D CMAKE_INSTALL_RPATH_USE_LINK_PATH:BOOL=ON                      \
            \
            -D ALBANY_HES_VEC_SLFAD_SIZE=100                                  \
            -D ALBANY_TAN_SLFAD_SIZE=100                                      \
            -D ALBANY_SLFAD_SIZE=90                                           \
            -D ENABLE_FAD_TYPE:STRING="SLFad"                                 \
            -D ENABLE_TAN_FAD_TYPE:STRING="SLFad"                             \
            -D ENABLE_HES_VEC_FAD_TYPE:STRING="SLFad"                         \
            \
            -D ENABLE_MPAS_INTERFACE:BOOL=ON                                  \
            -D ENABLE_OMEGAH:BOOL=OFF                                         \
            \
            -S ${GITHUB_WORKSPACE}/albany/source
      - name: Build Albany
        run: |
          cd ${GITHUB_WORKSPACE}/albany/build
          # nvcc is memory hungry: keep the number of jobs low to avoid OOM on the runner
          make -j 2
      - name: Install Albany
        run: |
          cd ${GITHUB_WORKSPACE}/albany/build
          make install
      - name: Upload log files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            albany/build/CMakeCache.txt
          retention-days: 14
