%YAML 1.1
---
# Albany input read by the MPAS-Albany interface (as in a MALI run). The interface sets everything
# else (physical parameters from MPAS, BCs, fields, cubature, ...).
ANONYMOUS:
  Problem:
    Depth Integrated Model: true
    LandIce Viscosity:
      Type: "Glen's Law"
      Flow Rate Type: Temperature Based

  Discretization: {}

  Piro:
    NOX:
      Nonlinear Solver: Line Search Based
      Line Search:
        Full Step:
          Full Step: 1.0e+00
        Method: Backtrack
      Solver Options:
        Status Test Check Type: Minimal
      Status Tests:
        Test Type: Combo
        Combo Type: OR
        Number of Tests: 2
        Test 0:
          Test Type: NormF
          Norm Type: Two Norm
          Scale Type: Scaled
          Tolerance: 1.0e-07
        Test 1:
          Test Type: MaxIters
          Maximum Iterations: 50
      Printing:
        Output Precision: 3
        Output Processor: 0
        Output Information:
          Error: true
          Warning: true
          Outer Iteration: true
          Parameters: false
          Details: false
          Linear Solver Details: false
          Stepper Iteration: true
          Stepper Details: true
          Stepper Parameters: true
      Direction:
        Method: Newton
        Newton:
          Forcing Term Method: Constant
          Rescue Bad Newton Solve: true
          Linear Solver:
            Write Linear System: false
            Tolerance: 1.0e-09
          Stratimikos Linear Solver:
            Stratimikos:
              Linear Solver Type: Belos
              Linear Solver Types:
                Belos:
                  Solver Type: Block GMRES
                  Solver Types:
                    Block GMRES:
                      Output Frequency: 20
                      Output Style: 1
                      Verbosity: 33
                      Maximum Iterations: 1000
                      Block Size: 1
                      Num Blocks: 300
                      Flexible Gmres: false
                  VerboseObject:
                    Output File: none
                    Verbosity Level: low
              Preconditioner Type: Ifpack2
              Preconditioner Types:
                Ifpack2:
                  Overlap: 1
                  Prec Type: ILUT
                  Ifpack2 Settings:
                    'fact: ilut level-of-fill': 2.0
