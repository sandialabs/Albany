%YAML 1.1
---
ANONYMOUS:
  Debug Output:
    #Write Solution to MatrixMarket: -3
    #Write Jacobian to MatrixMarket: -1
    #Write Residual to MatrixMarket: -1
  Problem:
    Phalanx Graph Visualization Detail: 0
    Solution Method: Transient
    Name: LandIce Coupled FO H 3D
    Compute Sensitivities: false
    Allow Loss Of Derivative Terms: true
    Time Step: 2.0e-01
    Basal Side Name: basalside
    Surface Side Name: upperside
    Flat Bed Approximation: true
    Cubature Degree: 4
    Basal Cubature Degree: 4
    Surface Cubature Degree: 4
    Response Functions:
      Number Of Responses: 1
      Response 0:
        Type: Scalar Response
        Name: Solution Average
    Dirichlet BCs:
      DBC on NS extruded_NodeSet0 for DOF U0: 0.0
      DBC on NS extruded_NodeSet0 for DOF U1: 0.0
    Neumann BCs: {}
    LandIce BCs:
      Number: 2
      BC 0:
        Type: Basal Friction
        Side Set Name: basalside
        Basal Friction Coefficient:
          Type: Field
          Beta Field Name: basal_friction
      BC 1:
        Type: Lateral
        Cubature Degree: 4
        Side Set Name: lateralside
    Parameters:
      Number Of Parameters: 0
      Parameter 0:
        Type: Scalar
        Name: Glen's Law Homotopy Parameter
    LandIce Physical Parameters:
      Water Density: 1.028e+03
      Ice Density: 9.10e+02
      Gravity Acceleration: 9.81e+00
      Clausius-Clapeyron Coefficient: 0.0
    LandIce Viscosity:
      Type: Glen's Law
      Glen's Law Homotopy Parameter: 0.3
      Glen's Law A: 2.400304414e-24            # [Pa^-n s^-1
      Glen's Law n: 3.0
      Flow Rate Type: Temperature Based
    Body Force:
      Type: FO INTERP SURF GRAD
  Discretization:
    Method: Extruded
    Number Of Time Derivatives: 1
    # Exodus Output File Name: output/humboldt_transient.exo
    Columnwise Ordering: false
    NumLayers: 5
    Thickness Field Name: ice_thickness
    #Surface Height Field Name: surface_height
    Use Glimmer Spacing: true
    Extrude Basal Fields: [ice_thickness, surface_height, bed_topography, thickness_forcing]
    Interpolate Basal Layered Fields: [temperature]
    Required Fields Info:
      Number Of Fields: 5
      Field 0:
        Field Name: ice_thickness
        Field Type: Node Scalar
        Field Origin: Mesh
      Field 1:
        Field Name: surface_height
        Field Type: Node Scalar
        Field Origin: Mesh
      Field 2:
        Field Name: temperature
        Field Type: Node Scalar
        Field Origin: Mesh
      Field 3:
        Field Name: bed_topography 
        Field Type: Node Scalar
        Field Origin: Mesh
      Field 4:
        Field Name: thickness_forcing
        Field Type: Node Scalar
        Field Origin: Mesh
    Side Set Discretizations:
      Side Sets: [basalside, upperside]
      basalside:
        Method: Omegah
        Mesh Creation Method: Box2D
        Number of Elements: [4, 4]   # M x N basal mesh (configurable)
        Box Scaling: [40.0, 40.0]    # domain [0,40]x[0,40] (km)
        Number Of Time Derivatives: 1
        Required Fields Info:
          Number Of Fields: 6
          Field 0:
            Field Name: ice_thickness
            Field Type: Node Scalar
            Field Origin: File
            Field Expression: ['1.0 - 0.01*x + 0.1*sin(3.14159265*y/40)']
          Field 1:
            Field Name: surface_height
            Field Type: Node Scalar
            Field Origin: File
            Field Expression: ['0.05*x + 1.0 - 0.01*x + 0.1*sin(3.14159265*y/40)']
          Field 2:
            Field Name: temperature
            Field Type: Node Layered Scalar
            Field Origin: File
            Number Of Layers: 8
            Field Value: 258.0   # same value for all layers
          Field 3:
            Field Name: basal_friction
            Field Type: Node Scalar
            Field Origin: File
            Field Expression: ['10.0 + 5.0*x/40 + 0.0*y']
          Field 4:
            Field Name: bed_topography
            Field Type: Node Scalar
            Field Origin: File
            Field Expression: ['0.05*x + 0.0*y']
          Field 5:
            Field Name: thickness_forcing
            Field Type: Node Scalar
            Field Origin: File
            Field Value: 0.0
  Piro:
    Tempus: 
      Integrator Name: Tempus Integrator
      Tempus Integrator: 
        Integrator Type: Integrator Basic
        Screen Output Index List: '1'
        Screen Output Index Interval: 1
        Stepper Name: Tempus Stepper
        Solution History: 
          Storage Type: Unlimited
          Storage Limit: 20
        Time Step Control: 
          Initial Time: 0.0
          Initial Time Index: 0
          Initial Time Step: 0.2
          Final Time: 0.4
          Final Time Index: 1000
          Maximum Absolute Error: 1.0e-08
          Maximum Relative Error: 1.0e-08
          Output Time List: ''
          Output Index List: ''
          #Output Time Interval: 1.0e+01
          Output Index Interval: 1000
          Maximum Number of Stepper Failures: 10
          Maximum Number of Consecutive Stepper Failures: 5
      Tempus Stepper: 
        Stepper Type: Backward Euler
        VerboseObject:
          Verbosity Level: medium
        Solver Name: Demo Solver
        Demo Solver: 
          VerboseObject:
            Verbosity Level: medium
          NOX:
            Status Tests:
              Test Type: Combo
              Combo Type: OR
              Number of Tests: 2
              Test 0:
                Test Type: NormF
                Norm Type: Two Norm
                Scale Type: Unscaled
                Tolerance: 1.0e-04
              Test 1:
                Test Type: MaxIters
                Maximum Iterations: 50
            Direction:
              Method: Newton
              Newton:
                Forcing Term Method: Constant
                Linear Solver:
                  Write Linear System: false
                  Tolerance: 1.0e-4  #used for forward solve
                Stratimikos Linear Solver:
                  NOX Stratimikos Options: {}
                  Stratimikos:
                    Linear Solver Type: Belos
                    Linear Solver Types:
                      Belos:
                        VerboseObject:
                          Verbosity Level: medium
                        Solver Type: Block GMRES
                        Solver Types:
                          Block GMRES:
                            Convergence Tolerance: 1.0e-07
                            Output Frequency: 10
                            Output Style: 1
                            Verbosity: 33
                            Maximum Iterations: 100
                            Block Size: 1
                            Num Blocks: 50
                            Flexible Gmres: false
                    Preconditioner Type: Ifpack2
                    Preconditioner Types:
                      Ifpack2:
                        Overlap: 0
                        Prec Type: Amesos2 # RILUK
                        Ifpack2 Settings:
                          Amesos2: {}
                          Amesos2 solver name: klu
                          'fact: iluk level-of-fill': 0
                Rescue Bad Newton Solve: true
            Line Search:
              Full Step:
                Full Step: 1.0
              Method: Full Step
            Nonlinear Solver: Line Search Based
            Printing:
              Output Precision: 3
              Output Processor: 0
              Output Information:
                Error: true
                Warning: true
                Outer Iteration: true
                Parameters: false
                Details: false
                Linear Solver Details: false
                Stepper Iteration: true
                Stepper Details: true
                Stepper Parameters: true
            Solver Options:
              Status Test Check Type: Minimal

      Stratimikos:
            Linear Solver Type: Belos
            Linear Solver Types:
              Belos:
                VerboseObject:
                  Verbosity Level: medium
                Solver Type: Block GMRES
                Solver Types:
                  Block GMRES:
                    Convergence Tolerance: 1.0e-07
                    Output Frequency: 10
                    Output Style: 1
                    Verbosity: 33
                    Maximum Iterations: 100
                    Block Size: 1
                    Num Blocks: 50
                    Flexible Gmres: false
            Preconditioner Type: Ifpack2
            Preconditioner Types:
              Ifpack2:
                Overlap: 0
                Prec Type: Amesos2 # RILUK
                Ifpack2 Settings:
                  Amesos2: {}
                  Amesos2 solver name: klu
                  'fact: iluk level-of-fill': 0


  # TODO: add 'Regression For Response 0' with a Test Value generated from a real run
...
