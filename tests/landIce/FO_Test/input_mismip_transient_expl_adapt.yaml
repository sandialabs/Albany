%YAML 1.1
---
# MISMIP adaptive-mesh variant (Omega_h + SPR). Smoke test: no regression value yet.
# The SPR parameters are initial guesses; check the SPR error printed (Verbose) to tune them.
ANONYMOUS:
  Debug Output:
          #Write Solution to MatrixMarket: -1
          #Write Jacobian to MatrixMarket: -1
          #Write Residual to MatrixMarket: -1
  Problem:
    Depth Integrated Model: true
    Phalanx Graph Visualization Detail: 1
    Use MDField Memoization: False
    Solution Method: Transient
    Name: LandIce Coupled FO H 3D
    Compute Sensitivities: false
    Allow Loss Of Derivative Terms: true
    Thickness Stabilization: Graph Viscosity
    Basal Side Name: basalside
    Surface Side Name: upperside
    Flat Bed Approximation: false
    Cubature Degrees (Horiz Vert): [4, 7]
    Basal Cubature Degree: 4
    Surface Cubature Degree: 4
    LandIce Field Norm:
      sliding_velocity_basalside:
        Regularization Type: Given Value
        Regularization Value: 1.0e-05
    Response Functions:
      Number Of Responses: 1
      Response 0:
        Type: Scalar Response
        Name: Solution Average
    Dirichlet BCs:
      SDBC on NS extruded_boundary_node_set_1 for DOF U0: 0.0
      SDBC on NS extruded_boundary_node_set_1 for DOF U1: 0.0
      SDBC on NS extruded_boundary_node_set_3 for DOF U1: 0.0
    Neumann BCs: {}
    LandIce BCs:
      Number: 2
      BC 0:
        Type: Basal Friction
        Side Set Name: basalside
        Basal Friction Coefficient:
          Type: Power Law
          Mu Type: Constant
          Mu: 10000.0
          Zero Beta On Floating Ice: true
          Power Exponent: 0.33333333333
          Effective Pressure Type: Constant
          Effective Pressure: 1.0
          Use Pressurized Bed Above Sea Level: false
      BC 1:
        Type: Lateral
        Cubature Degree: 4
        Side Set Name: lateralside
    Parameters:
      Number Of Parameters: 0
    LandIce Physical Parameters:
      Water Density: 1.028e+03
      Ice Density: 9.10e+02
      Gravity Acceleration: 9.81e+00
      Clausius-Clapeyron Coefficient: 0.0
    LandIce Viscosity:
      Type: Glen's Law
      Glen's Law Homotopy Parameter: 0.3
      Glen's Law A: 6.3419584e-25           # [Pa^-n s^-1
      Glen's Law n: 3.0
      Flow Rate Type: Uniform
    Body Force:
      Type: FO INTERP SURF GRAD
  Discretization:
    Method: Extruded
    Number Of Time Derivatives: 1
    Columnwise Ordering: false
    NumLayers: 1
    Thickness Field Name: ice_thickness
    Use Glimmer Spacing: true
    Extrude Basal Fields: [ice_thickness, surface_height, bed_topography, thickness_forcing]
    Required Fields Info:
      Number Of Fields: 4
      Field 0:
        Field Name: ice_thickness
        Field Type: Node Scalar
        Field Origin: Mesh
      Field 1:
        Field Name: surface_height
        Field Type: Node Scalar
        Field Origin: Mesh
      Field 2:
        Field Name: bed_topography
        Field Type: Node Scalar
        Field Origin: Mesh
      Field 3:
        Field Name: thickness_forcing
        Field Type: Node Scalar
        Field Origin: Mesh
    Side Set Discretizations:
      Side Sets: [basalside, upperside]
      basalside:
        Method: Omegah
        Mesh Creation Method: OshFile
        Input Filename: ../AsciiMeshes/MISMIP_coarse/mismip_2d.osh
        Number Of Time Derivatives: 1
        Mark Parts: [boundary_side_set, boundary_side_set_1, boundary_side_set_2, boundary_node_set_1, boundary_node_set_3]
        Mesh Adaptivity:
          Type: SPR # superconvergent patch recovery
          # The indicator is the effective strain rate computed by the FO problem;
          # it is large around the grounding line, where we want a finer mesh.
          Indicator Field Name: effective_strain_rate
          # NOTE: initial guesses (mesh units: km, coarse base mesh h~10km). Edge lengths are
          # bounded to [h/2, 2h] so the mesh (and the direct solve) stays small.
          Adapt Ratio: 1.0
          Error Threshold: 0.05
          Minimum Edge Length: 5.0
          Maximum Edge Length: 20.0
          Write VTK Files: false
          Verbose: true
        Required Fields Info:
          Number Of Fields: 4
          Field 0:
            Field Name: ice_thickness
            Field Type: Node Scalar
            Field Origin: File
            File Name: ../AsciiMeshes/MISMIP_coarse/thickness.ascii
          Field 1:
            Field Name: surface_height
            Field Type: Node Scalar
            Field Origin: File
            File Name: ../AsciiMeshes/MISMIP_coarse/surface_height.ascii
          Field 2:
            Field Name: bed_topography
            Field Type: Node Scalar
            Field Origin: File
            File Name: ../AsciiMeshes/MISMIP_coarse/bed_topography.ascii
          Field 3:
            Field Name: thickness_forcing
            Field Type: Node Scalar
            Field Origin: File
            Field Value: 0.3
      upperside:
        Number Of Time Derivatives: 1

  Piro:
    Tempus: 
      Integrator Name: Tempus Integrator
      Lump Mass Matrix: true
      Constant Mass Matrix: true
      Tempus Integrator: 
        Integrator Type: Integrator Basic
        Screen Output Index List: '1'
        Screen Output Index Interval: 1
        Stepper Name: Tempus Stepper
        Solution History: 
          Storage Type: Unlimited
          Storage Limit: 20
        Time Step Control: 
          Initial Time: 0.0
          Initial Time Index: 0
          Initial Time Step: 0.1
          Final Time: 0.3
          #Final Time Index: 1000
          Maximum Absolute Error: 1.0e-08
          Maximum Relative Error: 1.0e-08
          Output Time List: ''
          Output Index List: ''
          #Output Time Interval: 1.0e+01
          #Output Index Interval: 1000
          Maximum Number of Stepper Failures: 10
          Maximum Number of Consecutive Stepper Failures: 5
      Tempus Stepper: 
        Stepper Type: Forward Euler
        #Stepper Type: SSPERK33
    NOX:
      # No NOX row-sum function scaling: its scaling vector is not rebuilt after mesh adaptation
      Status Tests:
        Test Type: Combo
        Combo Type: OR
        Number of Tests: 2
        Test 0:
            Test Type: NormF
            Norm Type: Two Norm
            Scale Type: Unscaled
            Tolerance: 1.0e-04
        Test 1:
          Test Type: MaxIters
          Maximum Iterations: 30
      Direction:
        Method: Newton
        Newton:
          Forcing Term Method: Constant
          Linear Solver:
            Write Linear System: false
            Tolerance: 1.0e-7  #used for forward solve
          Stratimikos Linear Solver:
            NOX Stratimikos Options: {}
            Stratimikos:
              Linear Solver Type: Belos
              Linear Solver Types:
                Belos:
                  VerboseObject:
                    Verbosity Level: medium
                  Solver Type: Block GMRES
                  Solver Types:
                    Block GMRES:
                      Convergence Tolerance: 1.0e-07
                      Output Frequency: 10
                      Output Style: 1
                      Verbosity: 33
                      Maximum Iterations: 500
                      Block Size: 1
                      Num Blocks: 50
                      Flexible Gmres: false
              Preconditioner Type: Ifpack2
              Preconditioner Types:
                Ifpack2:
                  Overlap: 0
                  Prec Type: Amesos2 # RILUK
                  Ifpack2 Settings:
                    Amesos2: {}
                    Amesos2 solver name: klu
                    'fact: iluk level-of-fill': 0
          Rescue Bad Newton Solve: true
      Line Search:
        Full Step:
          Full Step: 1.0
        Method: Polynomial
      Nonlinear Solver: Line Search Based
      Printing:
        Output Precision: 3
        Output Processor: 0
        Output Information:
          Error: true
          Warning: true
          Outer Iteration: true
          Parameters: false
          Details: false
          Linear Solver Details: false
          Stepper Iteration: true
          Stepper Details: true
          Stepper Parameters: true
      Solver Options:
        Status Test Check Type: Minimal


  # TODO: add "Regression For Response 0" once reference values are generated.
...
